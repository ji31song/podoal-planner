<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포도알플래너 폰트 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Gowun+Dodum&display=swap">
<style>
  @font-face {
    font-family: 'GmarketSansMedium';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
  }
  @font-face {
    font-family: 'NanumSquareRound';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #2F2D2A; font-family: sans-serif; padding: 24px; }
  .grid { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .phone { width: 330px; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .label { text-align: center; color: #fff; font-size: 15px; font-weight: 800; padding: 10px 0 14px; font-family: sans-serif; }
  .label small { display: block; font-weight: 400; color: #bbb; margin-top: 3px; font-size: 12px; }
  .screen { padding: 20px 14px 24px; height: 560px; background: #FFFFFF; color: #6B6661; }
  header { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 4px; }
  .hero { font-size: 44px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; color: #3B3835; }
  .today { font-size: 12px; margin-top: 4px; color: #A5A09A; }
  .tabs { display: flex; gap: 7px; margin-top: 12px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 15px; background: #F4F2F0; }
  .tab.active { background: #8E62AC; color: #fff; }
  .tab .av { font-size: 26px; }
  .tab .lbl { font-size: 12px; font-weight: 800; }
  .card { background: #fff; border-radius: 18px; padding: 14px; margin-top: 12px; border: 1px solid #DCC9EC; box-shadow: 0 2px 10px rgba(124,82,150,.05); }
  .card h2 { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: #3B3835; }
  .edit-btn { margin-left: auto; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: none; background: #F2E7DB; color: #A97C52; font-family: inherit; }
  .prog { border-radius: 999px; height: 8px; margin: 12px 0 6px; overflow: hidden; background: #F0EDF1; }
  .prog i { display: block; height: 100%; width: 66%; background: #8E62AC; border-radius: 999px; }
  .pct { font-size: 11px; text-align: right; color: #A5A09A; }
  .chk { list-style: none; padding: 0; margin-top: 6px; }
  .chk li { display: flex; align-items: center; gap: 8px; padding: 8px 2px; font-size: 13px; border-bottom: 1px solid #F0EEEB; }
  .chk input { accent-color: #8E62AC; width: 15px; height: 15px; }
  .btn { width: 100%; border: none; margin-top: 12px; padding: 12px; color: #fff; font-size: 13px; font-weight: 800; border-radius: 13px; background: linear-gradient(135deg, #9268B0, #7C5296); font-family: inherit; }
</style>
</head>
<body>
<div class="grid">
</div>
<script>
  const FONTS = [
    ["1. 현재 (시스템 기본)", "안드로이드 Roboto/Noto Sans", "'Noto Sans KR', sans-serif"],
    ["2. Pretendard", "요즘 앱 표준, 깔끔·세련", "'Pretendard Variable', Pretendard, sans-serif"],
    ["3. SUIT", "기하학적, 모던하고 단정", "'SUIT Variable', 'SUIT', sans-serif"],
    ["4. 나눔스퀘어라운드", "부드러운 라운드, 친근함", "'NanumSquareRound', sans-serif"],
    ["5. Gmarket Sans", "브랜드 느낌, 개성 있음", "'GmarketSansMedium', sans-serif"],
  ];
  const grid = document.querySelector(".grid");
  for (const [name, desc, family] of FONTS) {
    const d = document.createElement("div");
    d.innerHTML = `
    <div class="label">${name} <small>${desc}</small></div>
    <div class="phone"><div class="screen" style="font-family:${family.replace(/"/g,'&quot;')};">
      <header><span class="hero">🍇</span><div><h1>행복패밀리</h1><div class="today">오늘은 7월 20일 (월)</div></div></header>
      <div class="tabs">
        <div class="tab active"><span class="av">🍇</span><span class="lbl">준우</span></div>
        <div class="tab"><span class="av">🍇</span><span class="lbl">유진</span></div>
        <div class="tab"><span class="av">👩</span><span class="lbl">엄마</span></div>
        <div class="tab"><span class="av">👨</span><span class="lbl">아빠</span></div>
      </div>
      <div class="card">
        <h2>🍇 포도알 받기 <button class="edit-btn">항목 편집</button></h2>
        <div class="prog"><i></i></div>
        <div class="pct">2 / 3 완료 (67%)</div>
        <ul class="chk">
          <li><input type="checkbox" checked> 독해문제집 풀기</li>
          <li><input type="checkbox"> 방 정리하기</li>
          <li><input type="checkbox" checked> 학원 제 시간에 가기</li>
        </ul>
        <button class="btn">🍇 오늘 포도알 받기</button>
      </div>
    </div></div>`;
    grid.appendChild(d);
  }
</script>
</body>
</html>
