<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아이 아바타 3종</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap">
<style>
  body { background: #F1EFF5; font-family: 'Poor Story', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; gap: 40px; }
  .mem { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .circ {
    width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 3px solid #8E62AC;
    box-shadow: 0 2px 10px rgba(90,70,120,.08);
  }
  .circ img { width: 68px; height: 68px; object-fit: contain; }
  .circ.c-green { border-color: #86A867; background: #EDF5E6; }
  .circ.c-deep { border-color: #6B3F87; background: #EFE7F6; }
  .nm { font-size: 22px; color: #555060; }
</style>
</head>
<body>
  <div class="mem"><div class="circ"><img src="assets/img-09.png" alt=""></div><div class="nm">첫째 (보라)</div></div>
  <div class="mem"><div class="circ c-green"><img src="assets/img-09-green.png" alt=""></div><div class="nm">둘째 (연두)</div></div>
  <div class="mem"><div class="circ c-deep"><img src="assets/img-09-deep.png" alt=""></div><div class="nm">셋째 (진보라)</div></div>
</body>
</html>
